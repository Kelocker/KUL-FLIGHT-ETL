name: Daily Flight ETL Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:



jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Run ETL Script
        env:
          API_KEY: ${{ secrets.API_KEY }} 
        run: python main.py 

      - name: Commit and push database
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add flight.db
          # Only commit if the database actually changed
          git commit -m "Automated ETL: Update flight database (MYT Run)" || echo "No changes to commit"
          git push